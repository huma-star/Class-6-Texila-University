<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ٹیکسلا یونیورسٹی – انٹرایکٹو سبق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* فونٹ: اگر کمپیوٹر میں Jameel Noori Nastaleeq انسٹال ہے تو وہی استعمال ہوگا۔
   ورنہ اس HTML کے ساتھ والے فولڈر میں فونٹ فائل کا نام  JameelNooriNastaleeq.ttf  رکھ کر لگا دیں۔ */
@font-face{font-family:"JNN";src:local("Jameel Noori Nastaleeq"),local("JameelNooriNastaleeq"),local("Jameel Noori Nastaleeq Regular"),url("JameelNooriNastaleeq.ttf") format("truetype"),url("Jameel Noori Nastaleeq.ttf") format("truetype");font-display:swap}
:root{--green:#8cc63f;--green-d:#5e9a1e;--terra:#e2703a;--teal:#1aa6a6;--ink:#2b2a33;--purple:#6c4bd6;--gold:#f7b500;--rose:#e84a7f;--sky:#3f9bff;--sand:#fff6e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"JNN","Jameel Noori Nastaleeq","Noto Nastaliq Urdu","Segoe UI Emoji","Noto Color Emoji",serif;font-size:19px;line-height:2.2;color:var(--ink);background:#fff8e6;background-image:radial-gradient(circle at 15% 8%,#ffe9b8 0,transparent 38%),radial-gradient(circle at 92% 28%,#d9f2b8 0,transparent 34%),radial-gradient(circle at 50% 100%,#cfeaff 0,transparent 40%);background-attachment:fixed;padding-bottom:190px;overflow-x:hidden}
button,textarea,input{font-family:inherit;font-size:inherit}
b{font-weight:700}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}

/* ---------- ہیڈر ---------- */
.hdr{position:sticky;top:0;z-index:60}
.topbar{background:linear-gradient(90deg,#5e9a1e,#8cc63f);color:#fff;display:flex;align-items:center;gap:8px;padding:2px 12px;box-shadow:0 4px 14px #0003}
.brand{font-size:1.25em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#ffffff33;border:0;color:#fff;border-radius:99px;padding:0 12px;white-space:nowrap;cursor:pointer}
.xpbar{height:7px;background:#00000026}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a3d);transition:width .6s;border-radius:0 4px 4px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 10px;background:#fffdf5f2;backdrop-filter:blur(6px);border-bottom:3px dashed #e5d7a8;scrollbar-width:thin}
.tab{flex:none;border:0;border-radius:16px;padding:0 14px;background:#fff;cursor:pointer;box-shadow:0 3px 0 #d9c98f;color:var(--ink);transition:.15s;position:relative}
.tab.active{background:var(--terra);color:#fff;box-shadow:0 3px 0 #a9461b}
.tab .dn{position:absolute;top:-4px;inset-inline-start:-2px;font-size:.7em;line-height:1.2}
main{max-width:1040px;margin:auto}

/* ---------- عمومی ---------- */
.sec{display:none;padding:8px 10px}
.sec.active{display:block;animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.banner{background:var(--green);color:#fff;border-radius:20px;padding:4px 20px;text-align:center;font-size:1.55em;box-shadow:inset 0 -7px 0 #0000001f,0 6px 0 #4d8216;margin:14px 0 20px}
.card{background:#fff;border-radius:26px;padding:16px 20px;margin:16px 0;box-shadow:0 7px 0 #0000000d,0 14px 30px #0000001a;border:3px solid #fff}
.card h2,.card h3{margin:0 0 4px}
.card h2{font-size:1.35em;color:var(--terra)}
.card h3{font-size:1.15em;color:var(--purple)}
.hint{background:#fff3c4;border:2px dashed #e6bd2c;border-radius:18px;padding:2px 16px;margin:10px 0}
.btn{border:0;border-radius:18px;padding:2px 22px;background:var(--terra);color:#fff;cursor:pointer;box-shadow:0 5px 0 #a9461b;transition:.12s;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a9461b}
.btn.green{background:var(--green-d);box-shadow:0 5px 0 #3f6a0e}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 #0c7474}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 #4328a8}
.btn.gold{background:var(--gold);color:#4a3600;box-shadow:0 5px 0 #b88700}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d9c98f;border:2px solid #eadfb5}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nextwrap{text-align:center;margin:26px 0}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(9px)}40%,80%{transform:translateX(-9px)}}
.grow{animation:grow .5s}
@keyframes grow{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{text-align:center}
.bar{height:16px;border-radius:99px;background:#eee;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8cc63f,#2fa84f);width:0;transition:width .6s;border-radius:99px}

/* ---------- آغاز ---------- */
.hero{padding:0;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.hero-t{padding:6px 20px 18px;text-align:center}
.ribbon{display:inline-block;background:var(--green);color:#fff;font-size:2em;padding:0 40px;border-radius:14px;box-shadow:0 6px 0 #4d8216;margin-top:-6px}
.sub{color:#777;font-size:.95em}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:10px}
.stn{border:0;border-radius:22px;padding:10px 8px;cursor:pointer;color:#fff;box-shadow:0 6px 0 #00000026;transition:.15s;position:relative;text-align:center}
.stn:hover{transform:translateY(-4px) rotate(-1deg)}
.stn .em{font-size:2.1em;display:block;line-height:1.5}
.stn.ok::after{content:"✅";position:absolute;top:2px;inset-inline-start:8px;font-size:1.3em}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--green-d) calc(var(--p)*1%),#e8e8e8 0);display:grid;place-items:center;flex:none}
.ring b{background:#fff;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;line-height:1}
.fact{background:linear-gradient(135deg,#e7f6ff,#fff3d6);border-radius:20px;padding:6px 18px;border:3px dashed #8fc9ff;min-height:80px}
.sun{transform-origin:640px 70px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl1{animation:drift 30s linear infinite alternate}.cl2{animation:drift 45s linear infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(80px)}}
.walker{animation:walk 14s linear infinite}
@keyframes walk{from{transform:translateX(-80px)}to{transform:translateX(900px)}}
.bird{animation:fly 18s linear infinite}
@keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(880px,-40px)}}

/* ---------- پیراگراف ---------- */
.pcard{background:#fff;border-radius:22px;margin:14px 0;box-shadow:0 6px 0 #00000012,0 10px 24px #0000001a;overflow:hidden;border:3px solid #fff}
.phead{width:100%;border:0;background:linear-gradient(90deg,#fff,#fff8dd);display:flex;gap:10px;align-items:center;padding:2px 14px;cursor:pointer;color:var(--ink);text-align:start}
.pnum{background:var(--terra);color:#fff;border-radius:50%;width:2em;height:2em;display:grid;place-items:center;line-height:1;flex:none}
.pemo{font-size:1.5em}
.ptitle{flex:1;font-size:1.1em}
.pchk{font-size:1.2em}
.pbody{display:none;padding:6px 18px 16px;border-top:3px dashed #f0e4b8}
.pcard.open .pbody{display:block;animation:pop .35s}
.ptext{font-size:1.08em;line-height:2.5;background:#fffdf3;border-radius:16px;padding:6px 16px}
.kw{color:var(--purple);background:#efe8ff;border-bottom:3px dotted var(--purple);border-radius:6px;padding:0 3px;cursor:pointer}
.gist{background:#e6f9d3;border-radius:16px;padding:2px 16px;margin:10px 0;border:2px solid #9fd36a;animation:grow .5s}
.mcq{background:#f3f9ff;border-radius:18px;padding:6px 16px 10px;margin-top:12px;border:2px solid #cfe6ff}
.mcq .q{color:#0d5aa7;font-size:1.08em}
.opt{display:block;width:100%;text-align:start;border:3px solid #e8dcc0;background:#fffdf6;border-radius:16px;padding:0 16px;margin:8px 0;cursor:pointer;transition:.15s;color:var(--ink)}
.opt:hover:not(:disabled){transform:translateX(-5px);border-color:var(--teal)}
.opt.ok{background:#d8f5c0;border-color:#5aa51f}
.opt.bad{background:#ffd9d9;border-color:#e0534f;opacity:.75}
.fb{min-height:1.5em;color:#2d6a0a}
#tip{position:fixed;z-index:120;background:#2b2a33;color:#fff;border-radius:16px;padding:2px 16px;max-width:280px;display:none;box-shadow:0 10px 30px #0006;line-height:2}
#tip b{color:#ffd23f}

/* ---------- الفاظ ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.flip{perspective:900px;height:210px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;text-align:center;box-shadow:0 6px 0 #00000020}
.front{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.front .em{font-size:2.6em;line-height:1.4}
.front .w{font-size:1.25em}
.back{background:#fff;border:4px solid var(--c1);transform:rotateY(180deg);font-size:.82em;line-height:2}
.back .m{color:var(--c1);font-size:1.12em}
.back .ex{color:#666;font-size:.92em}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mbtn{display:block;width:100%;border:3px solid #e6d9ff;background:#faf7ff;border-radius:16px;padding:0 10px;margin:8px 0;cursor:pointer;line-height:1.9;min-height:56px;color:var(--ink);transition:.15s}
.mbtn.m2{border-color:#cfeeee;background:#f2fdfd;font-size:.86em}
.mbtn.sel{background:var(--purple);color:#fff;transform:scale(1.04)}
.mbtn.done{background:#d8f5c0;border-color:#5aa51f;color:#2d6a0a;pointer-events:none;opacity:.8}

/* ---------- مرکزی خیال / خلاصہ ---------- */
.pillars svg{width:100%;max-width:420px;display:block;margin:auto}
.col{fill:#e8dcc0;stroke:#c9b27a;stroke-width:3;transition:.5s}
.col.lit{fill:url(#gold);filter:drop-shadow(0 0 10px #ffd23f)}
.stmt{display:block;width:100%;text-align:start;border:3px solid #e8dcc0;background:#fffdf6;border-radius:16px;padding:0 16px;margin:8px 0;cursor:pointer;color:var(--ink);transition:.15s}
.stmt.ok{background:#d8f5c0;border-color:#5aa51f;pointer-events:none}
.stmt.bad{background:#ffd9d9;border-color:#e0534f}
textarea{width:100%;min-height:96px;border:3px solid #e8dcc0;border-radius:16px;padding:8px 14px;background:#fffdf6;resize:vertical;line-height:2.1;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--teal)}
.slide{border-radius:24px;padding:10px 22px 16px;color:#fff;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;animation:pop .4s;box-shadow:inset 0 -8px 0 #0002}
.slide .big{font-size:4em;line-height:1.4;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.slide h3{color:#fff;font-size:1.5em}
.slide p{font-size:1.1em;line-height:2.4;margin:4px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:10px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:#ddd;transition:.3s}
.dots i.on{background:var(--terra);transform:scale(1.4)}
.ctext{background:#fffdf3;border-radius:18px;padding:6px 16px;line-height:2.8}
.blank{border:3px dashed var(--purple);background:#f4efff;border-radius:12px;min-width:90px;padding:0 10px;cursor:pointer;color:var(--purple);margin:0 3px}
.blank.act{background:#e0d4ff;box-shadow:0 0 0 4px #d3c3ff}
.blank.filled{border-style:solid;color:var(--ink)}
.blank.ok{background:#d8f5c0;border-color:#5aa51f}
.blank.no{background:#ffd9d9;border-color:#e0534f}
.chip{border:0;border-radius:14px;padding:0 16px;background:var(--sky);color:#fff;cursor:pointer;margin:4px;box-shadow:0 4px 0 #1e6fcc}
.chip:disabled{opacity:.3}
.chip.tg{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9c98f;border:2px solid #eadfb5}
.chip.tg.sel{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 4px 0 #0c7474}
.chip.tg.ok{background:#d8f5c0;color:#2d6a0a;border-color:#5aa51f}
.chip.tg.no{background:#ffd9d9;color:#a82d2d;border-color:#e0534f}

/* ---------- کھیل ---------- */
.clue{background:#fff3c4;border-radius:14px;padding:0 14px;margin:6px 0;animation:grow .4s}
.tfcard{text-align:center;font-size:1.3em;min-height:130px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eaf6ff,#fff6dd);border-radius:22px;padding:4px 18px;line-height:2.3}
.tfb{font-size:1.2em;min-width:130px}
.streak{color:var(--rose)}

/* ---------- ٹائم لائن ---------- */
.stabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stab{border:0;border-radius:16px;padding:0 16px;cursor:pointer;background:#fff;box-shadow:0 4px 0 #d9c98f;color:var(--ink)}
.stab.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 #4328a8}
.stab:disabled{opacity:.5;cursor:not-allowed}
.tm{border-radius:26px;padding:12px 22px 20px;color:#fff;text-align:center;position:relative;overflow:hidden;min-height:330px;box-shadow:inset 0 -9px 0 #0002,0 10px 24px #0003;transition:background .5s}
.tm .big{font-size:4.6em;line-height:1.4;position:relative;z-index:2;animation:bob 2.2s ease-in-out infinite}
.tm .yr{display:inline-block;background:#fff;color:var(--ink);border-radius:99px;padding:0 24px;font-size:1.4em;position:relative;z-index:2;box-shadow:0 5px 0 #0003}
.tm h3{color:#fff;font-size:1.5em;position:relative;z-index:2;margin:6px 0 0}
.tm p{position:relative;z-index:2;font-size:1.08em;line-height:2.4;margin:0 auto;max-width:700px}
.fl{position:absolute;bottom:-40px;opacity:.22;font-size:2.2em;animation:up linear infinite;z-index:1}
@keyframes up{to{transform:translateY(-420px) rotate(25deg)}}
.path{position:relative;height:74px;margin:14px 6px 0}
.path::before{content:"";position:absolute;inset-inline:0;top:34px;height:8px;background:repeating-linear-gradient(90deg,#c9b27a 0 14px,transparent 14px 24px);border-radius:4px}
.pn{position:absolute;top:22px;width:30px;height:30px;border-radius:50%;border:4px solid #c9b27a;background:#fff;cursor:pointer;transform:translateX(50%);padding:0;font-size:.62em;line-height:1;color:var(--ink)}
[dir=rtl] .pn{transform:translateX(50%)}
.pn.past{background:var(--green);border-color:var(--green-d);color:#fff}
.pn.on{background:var(--terra);border-color:#a9461b;color:#fff;transform:translateX(50%) scale(1.35)}
.rider{position:absolute;top:-4px;font-size:1.9em;transform:translateX(50%);transition:inset-inline-start .6s ease;z-index:3;line-height:1.2}
.tray{display:flex;flex-wrap:wrap;gap:10px;background:#f4efff;border-radius:20px;padding:10px;border:3px dashed #c9b6ff;min-height:80px}
.ecard{border:0;border-radius:18px;padding:2px 14px;cursor:grab;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 5px 0 #0003;transition:.15s;text-align:center;line-height:1.9;min-width:140px}
.ecard small{display:block;font-size:.78em;opacity:.95}
.ecard.sel{transform:scale(1.1) rotate(-2deg);box-shadow:0 0 0 5px #ffd23f,0 6px 0 #0003}
.roadmap{position:relative;margin-top:14px;padding-inline-start:52px}
.roadmap::before{content:"";position:absolute;inset-inline-start:21px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(#c9b27a 0 14px,transparent 14px 22px);border-radius:4px}
.slot{position:relative;margin:14px 0;border-radius:20px;padding:6px 16px;min-height:76px;border:3px dashed #c9b27a;background:#fffdf6;display:flex;align-items:center;color:#a59467;cursor:pointer;transition:.15s}
.slot:hover,.slot.dropt{border-color:var(--purple);background:#f4efff}
.slot .node{position:absolute;inset-inline-start:-52px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;background:#fff;border:5px solid #c9b27a;display:grid;place-items:center;line-height:1;color:var(--ink);z-index:2}
.slot.filled{display:block;border:0;color:var(--ink);background:#fff;box-shadow:0 6px 0 #0000001a,0 10px 24px #0000001a;cursor:default;padding:8px 18px 14px;border-inline-start:10px solid var(--c1);animation:grow .55s}
.slot.filled .node{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:#fff;color:#fff;box-shadow:0 0 0 4px var(--c1)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.shead .semo{font-size:1.8em}
.syear{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:99px;padding:0 14px;font-size:.9em}
.stick{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.stick button{border:3px solid #eee;background:#fff;border-radius:12px;font-size:1.3em;cursor:pointer;padding:0 6px;line-height:1.6}
.stick button.on{border-color:var(--gold);background:#fff7d1;transform:scale(1.15)}
.saved{color:#2d8a0a}
.bookp{border-inline-start:8px solid var(--c1);background:#fff;border-radius:16px;padding:4px 16px;margin:10px 0;box-shadow:0 3px 10px #0001}
.bookp.empty{opacity:.45;border-color:#ccc}
.bookp .nt{background:#fffbe8;border-radius:12px;padding:2px 12px}

/* ---------- انعامات ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{border-radius:20px;text-align:center;padding:6px 8px;background:#eee;filter:grayscale(1);opacity:.55;line-height:1.9}
.bdg.on{filter:none;opacity:1;background:linear-gradient(135deg,#fff3c4,#ffe08a);box-shadow:0 5px 0 #d4a500;animation:grow .6s}
.bdg .em{font-size:2.4em;line-height:1.4;display:block}
.bdg small{display:block;font-size:.72em;color:#666}
.cert{border:10px double #b8860b;border-radius:10px;background:#fffdf0;padding:10px;margin:14px 0}
.cert-in{border:3px solid #e6c35c;padding:10px 26px 18px;text-align:center;position:relative}
.cert-t{font-size:2em;color:#8a5a00}
.seal{font-size:3.4em;line-height:1.3}
.stars{font-size:2.6em;letter-spacing:6px}

/* ---------- اُلّو ساتھی ---------- */
#owl{position:fixed;left:8px;bottom:6px;z-index:90;width:96px;pointer-events:none}
#owl svg{width:96px;height:auto;display:block;filter:drop-shadow(0 6px 6px #0003);animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-6px)}}
#owl.talk svg{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-18px) rotate(-6deg)}}
#bubble{position:absolute;left:92px;bottom:70px;width:max-content;max-width:min(300px,62vw);background:#fff;border:3px solid var(--green-d);border-radius:20px 20px 20px 4px;padding:0 14px;opacity:0;transform:scale(.6);transform-origin:bottom left;transition:.25s;pointer-events:none;box-shadow:0 8px 20px #0003;line-height:2.1;font-size:.9em}
#bubble.show{opacity:1;transform:scale(1)}
#toast{position:fixed;top:112px;left:50%;transform:translate(-50%,-30px);z-index:150;background:linear-gradient(135deg,#ffd23f,#ff9a3d);color:#3a2500;border-radius:22px;padding:2px 24px;box-shadow:0 12px 30px #0005;opacity:0;pointer-events:none;transition:.4s;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.xpf{position:fixed;z-index:160;color:var(--green-d);font-size:1.6em;pointer-events:none;animation:xpup 1.2s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff}
@keyframes xpup{to{transform:translateY(-70px);opacity:0}}
#modal{position:fixed;inset:0;z-index:300;background:#2b2a33cc;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:30px;padding:10px 26px 22px;max-width:460px;width:100%;text-align:center;animation:grow .5s}
#modal input{width:100%;border:3px solid #e8dcc0;border-radius:16px;padding:0 14px;text-align:center;margin:10px 0;background:#fffdf6}
#printSheet{display:none}
@media (max-width:620px){
 body{font-size:17px}
 .mcols{gap:8px}.lvl{display:none}
 .brand{font-size:1.05em}

<script>
(function(){
'use strict';

/* ====================== حالت اور محفوظ کاری ====================== */

function sfx(k){if(!S.sound)return;if(k==='ok'){tone(660,0,.12);tone(880,.1,.18)}else if(k==='bad'){tone(220,0,.18,'square');tone(170,.14,.22,'square')}else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,i*.12,.25,'triangle'))}else if(k==='tap'){tone(520,0,.06)}}

 for(let i=0;i<(n||120);i++)parts.push({x:x==null?innerWidth/2:x,y:y==null?innerHeight/3:y,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,r:Math.random()*7+4,c:rnd(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:110+Math.random()*40});
 if(!raf)loop()}

function mcq(o){const w=h('<div class="mcq"><div class="q">❓ '+o.q+'</div><div class="opts"></div><div class="fb"></div></div>');const box=$('.opts',w),fb=$('.fb',w);let tries=0,over=false;
 shuffle(o.o.map((t,i)=>({t:t,ok:i===0}))).forEach(op=>{const b=h('<button class="opt">'+op.t+'</button>');
  b.onclick=()=>{if(over||b.disabled)return;
   if(op.ok){over=true;b.classList.add('ok');$$('.opt',w).forEach(x=>x.disabled=true);fb.textContent='🎉 شاباش! بالکل درست۔';sfx('ok');if(o.done)o.done(tries===0,b)}
   else{tries++;b.classList.add('bad');b.disabled=true;fb.textContent='🤔 دوبارہ سوچو۔'+(o.hint?' اشارہ: '+o.hint:'');sfx('bad');shake(b)}};
  box.append(b)});return w}
